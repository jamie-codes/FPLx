name: Data Pipeline

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'  # 4x daily: 6am, 12pm, 6pm, midnight UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      USE_BLOB: 'true'
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests==2.32.3 pandas==2.2.3 vercel-blob==0.6.0 python-dotenv==1.0.1 anthropic==0.40.0

      - name: Run pipeline
        run: python pipeline/run.py
